  <script>
    // Prevent theme flash before enhance script loads
    (function () {
      var t = localStorage.getItem('achylo-theme') || 'light';
      document.documentElement.dataset.theme = t;
    })();

<body>
  <div id="app"></div>
  <div id="google_translate_container"></div>

  <script>
    window.$docsify = {
      name: 'AchyloPay',
      logo: '/assets/images/logo.svg',
      repo: '',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 0,
      auto2top: true,
      routerMode: 'history',
      basePath: '/',
      notFoundPage: true,
      search: {
        placeholder: 'Search docs…',
        noData: 'No results',
        depth: 3,
        // Keep sidebar nav visible — search UI lives in the header overlay
        hideOtherSidebarContent: false,
        pathNamespaces: null
      },
      plugins: []
    };
  </script>

  <script src="/assets/js/docs-enhance.js?v=cb-type-8"></script>
  <script>
    // Register enhance plugin before Docsify boots
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(
      window.AchyloDocsEnhance ? [window.AchyloDocsEnhance] : []
    );
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
